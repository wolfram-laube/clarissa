# Load Balancing & Fallback Test Pipeline
# Ref: Issue #155, ADR-015

# ============================================================
# FALLBACK TESTS - Generische Tags
# ============================================================

fallback-shell:
  stage: test
  tags: [shell-any]
  script:
    - echo "=== Fallback Test Shell ==="
    - echo "Runner $CI_RUNNER_DESCRIPTION"
    - hostname
  rules:
    - when: manual

fallback-docker:
  stage: test
  tags: [docker-any]
  image: python:3.11-slim
  script:
    - echo "=== Fallback Test Docker ==="
    - echo "Runner $CI_RUNNER_DESCRIPTION"
  rules:
    - when: manual

fallback-k8s:
  stage: test
  tags: [k8s-any]
  image: python:3.11-slim
  script:
    - echo "=== Fallback Test K8s ==="
    - echo "Runner $CI_RUNNER_DESCRIPTION"
  rules:
    - when: manual

# ============================================================
# LOAD BALANCE TEST - 8 parallele Jobs auf 4 Shell Runner
# ============================================================

load-balance-shell:
  stage: test
  tags: [shell-any]
  parallel: 8
  script:
    - echo "=== Load Balance Test ==="
    - echo "Job $CI_NODE_INDEX of $CI_NODE_TOTAL"
    - echo "Runner $CI_RUNNER_DESCRIPTION"
    - hostname
    - sleep 3
  rules:
    - when: manual

# ============================================================
# PLATFORM TESTS
# ============================================================

platform-mac:
  stage: test
  tags: [mac-any]
  script:
    - echo "macOS Runner $CI_RUNNER_DESCRIPTION"
    - sw_vers 2>/dev/null || echo "Docker/K8s"
  rules:
    - when: manual

platform-linux:
  stage: test
  tags: [linux-any]
  script:
    - echo "Linux Runner $CI_RUNNER_DESCRIPTION"
    - uname -a
  rules:
    - when: manual

platform-gcp:
  stage: test
  tags: [gcp-any]
  script:
    - echo "GCP Runner $CI_RUNNER_DESCRIPTION"
  rules:
    - when: manual
