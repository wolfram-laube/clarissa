# Runner Benchmark - All 12 Runners

.benchmark_base:
  stage: test
  timeout: 5 minutes
  script:
    - echo "=== Runner Benchmark ==="
    - echo "Host:" $(hostname)
    - date
    - python3 -c "import time; s=time.time(); print(sum(1 for i in range(2,500000) if all(i%j for j in range(2,int(i**0.5)+1))),'primes in',round(time.time()-s,2),'s')"
    - echo "=== Done ==="
  rules:
    - when: manual

# Mac #1
benchmark-mac1-shell:
  extends: .benchmark_base
  tags: [mac-group-shell]

benchmark-mac1-docker:
  extends: .benchmark_base
  tags: [mac-docker]
  image: python:3.11-slim

benchmark-mac1-k8s:
  extends: .benchmark_base
  tags: [mac-k8s]
  image: python:3.11-slim

