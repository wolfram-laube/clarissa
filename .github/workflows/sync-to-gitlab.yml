name: Sync to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/wolfram_laube/blauweiss_llc/projects/clarissa.git || true
          git push gitlab HEAD:main --force-with-lease
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
